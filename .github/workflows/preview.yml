name: Personal Build

on:
  workflow_dispatch:

jobs:
  build-personal:
    name: Build Personal APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Personal Keystore
        run: |
          rm -f app/anizen.jks
          keytool -genkey -v -keystore app/anizen.jks -storepass anizen123 -alias anizen -keypass anizen123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AniZen Personal,O=AniZen,C=US"

      - name: Build Release APK
        run: ./gradlew assembleRelease -Pinclude-telemetry=false --no-daemon
        env:
          SIGNING_STORE_PASSWORD: anizen123
          SIGNING_KEY_ALIAS: anizen
          SIGNING_KEY_PASSWORD: anizen123

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-Personal-Release
          path: app/build/outputs/apk/release/*.apk
