name: Personal Build

on:
  workflow_dispatch:

jobs:
  build-personal:
    name: Build Personal APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Personal Keystore
        run: |
          echo "${{ secrets.PERSONAL_KEYSTORE_BASE64 }}" | base64 --decode > app/anizen.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease -Pinclude-telemetry=false --no-daemon
        env:
          SIGNING_STORE_PASSWORD: anizen123
          SIGNING_KEY_ALIAS: anizen
          SIGNING_KEY_PASSWORD: anizen123

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-Personal-Release
          path: app/build/outputs/apk/release/*.apk
